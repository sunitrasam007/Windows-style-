<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome Sonali</title>
<style>
:root{box-sizing:border-box;--ink:#fff;--glass:rgba(255,255,255,.14);--glass-b:rgba(255,255,255,.28);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);background:#0a1a3a}
.wall{position:fixed;inset:0;background:
  radial-gradient(60% 50% at 30% 40%,#2f7bff 0%,transparent 70%),
  radial-gradient(50% 45% at 70% 60%,#8a4dff 0%,transparent 70%),
  radial-gradient(40% 40% at 55% 25%,#19c3ff 0%,transparent 70%),
  radial-gradient(45% 40% at 20% 85%,#ff5fa8 0%,transparent 70%),#0b2a6b;z-index:0}
.wall.blur{filter:blur(18px) saturate(1.2);transform:scale(1.1)}
.screen{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.screen.on{display:flex}
/* lock */
.clock{position:absolute;top:12%;left:0;right:0}
.clock .t{font-size:clamp(64px,16vw,120px);font-weight:600;letter-spacing:-2px;line-height:1}
.clock .d{font-size:clamp(16px,4vw,22px);margin-top:8px;opacity:.9}
.hint{position:absolute;bottom:14%;opacity:.85;font-size:15px}
/* login */
.avatar{width:128px;height:128px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-b);display:grid;place-items:center;margin-bottom:18px}
.avatar svg{width:72px;height:72px;fill:#fff}
h1{font-size:clamp(26px,6vw,34px);font-weight:600;margin:0 0 6px}
p.sub{margin:0 0 22px;opacity:.9}
.pw{display:flex;align-items:center;width:min(300px,86vw);background:rgba(20,20,30,.55);border:1px solid var(--glass-b);border-bottom:2px solid #60cdff;border-radius:6px;backdrop-filter:blur(20px)}
.pw input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:16px;padding:11px 12px}
.pw input::placeholder{color:rgba(255,255,255,.65)}
.pw button{background:none;border:0;color:#fff;width:42px;height:40px;cursor:pointer;font-size:18px;border-radius:4px}
.pw button:hover{background:var(--glass)}
.err{height:20px;margin-top:10px;font-size:14px;color:#ffd1d1}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
.hintlink{background:none;border:0;color:#fff;font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;margin-top:6px;padding:6px 10px;opacity:.9}
.hintlink:hover{opacity:1}
.hinttext{min-height:20px;margin-top:4px;font-size:14px;opacity:.95}
.out{background:rgba(255,255,255,.16);color:#fff;border:1px solid var(--glass-b)}
.out:hover{background:rgba(255,255,255,.26)}
/* loading */
#load{background:#000;z-index:5}
.spin{position:relative;width:48px;height:48px;margin-bottom:28px}
.spin i{position:absolute;inset:0;animation:orb 3.2s infinite cubic-bezier(.4,.1,.4,.9);opacity:0}
.spin i::after{content:"";position:absolute;top:0;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#fff}
.spin i:nth-child(2){animation-delay:.15s}.spin i:nth-child(3){animation-delay:.3s}
.spin i:nth-child(4){animation-delay:.45s}.spin i:nth-child(5){animation-delay:.6s}
@keyframes orb{0%{transform:rotate(225deg);opacity:1;animation-timing-function:ease-out}
 7%{transform:rotate(345deg);animation-timing-function:linear}
 30%{transform:rotate(455deg);animation-timing-function:ease-in-out}
 39%{transform:rotate(690deg);animation-timing-function:linear}
 70%{transform:rotate(815deg);opacity:1;animation-timing-function:ease-out}
 75%{transform:rotate(945deg);animation-timing-function:ease-out}
 76%{transform:rotate(945deg);opacity:0}100%{transform:rotate(945deg);opacity:0}}
#load .msg{font-size:20px}
/* desktop */
#desk{justify-content:center}
.win{width:min(440px,92vw);background:rgba(32,32,40,.78);backdrop-filter:blur(30px);border:1px solid var(--glass-b);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;text-align:left;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.bar{display:flex;align-items:center;height:36px;padding-left:12px;font-size:13px;background:rgba(255,255,255,.06)}
.bar span{flex:1}
.bar b{width:44px;height:36px;display:grid;place-items:center;font-weight:400;font-size:14px}
.bar b:last-child:hover{background:#c42b1c}
.body{padding:34px 26px 28px;text-align:center}
.body .big{font-size:clamp(30px,8vw,40px);font-weight:600;margin:6px 0 10px}
.body .sm{font-size:18px;opacity:.92;margin:0 0 24px}
.ok{background:#60cdff;color:#001a2c;border:0;border-radius:5px;padding:9px 28px;font:inherit;font-weight:600;cursor:pointer}
.task{position:fixed;left:0;right:0;bottom:0;height:48px;background:rgba(28,28,36,.8);backdrop-filter:blur(30px);border-top:1px solid var(--glass-b);display:flex;align-items:center;justify-content:center;gap:6px;z-index:2}
.task .ic{width:34px;height:34px;display:grid;place-items:center;border-radius:6px;font-size:18px}
.task .ic:hover{background:var(--glass)}
.task .tray{position:absolute;right:14px;font-size:12px;text-align:right;line-height:1.25}
.win-logo{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:18px;height:18px}
.win-logo i{background:#60cdff}
@media (prefers-reduced-motion:reduce){.win{animation:none}}
</style>
</head>
<body>
<div class="wall" id="wall"></div>

<!-- 1. lock / welcome -->
<section class="screen on" id="lock">
  <div class="clock"><div class="t" id="t1">12:00</div><div class="d" id="d1"></div></div>
  <h1 style="font-size:clamp(30px,8vw,46px)">Hey Sonali, welcome 👋</h1>
  <div class="hint">Click anywhere to sign in</div>
</section>

<!-- 2. password -->
<section class="screen" id="login">
  <div class="avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c0-4.6 3.8-7.5 8.5-7.5s8.5 2.9 8.5 7.5z"/></svg></div>
  <h1>Sonali</h1>
  <p class="sub">Enter your password to continue</p>
  <div class="pw" id="pwbox">
    <input id="pw" type="password" placeholder="Password" autocomplete="off">
    <button id="go" aria-label="Sign in">&#10140;</button>
  </div>
  <div class="err" id="err"></div>
  <button class="hintlink" id="hintbtn" type="button">Password hint</button>
  <div class="hinttext" id="hinttext"></div>
</section>

<!-- 3. loading -->
<section class="screen" id="load">
  <div class="spin"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="msg" id="lmsg">Hi Sonali</div>
</section>

<!-- 4. final desktop -->
<section class="screen" id="desk">
  <div class="win">
    <div class="bar"><span>Message</span><b>&#8211;</b><b>&#9633;</b><b>&#10005;</b></div>
    <div class="body">
      <div style="font-size:54px">💖</div>
      <div class="big">You are cute</div>
      <div style="height:14px"></div>
      <div style="display:flex;gap:10px;justify-content:center"><button class="ok" id="out">Sign out</button></div>
    </div>
  </div>
  <div class="task">
    <div class="ic"><div class="win-logo"><i></i><i></i><i></i><i></i></div></div>
    <div class="ic">🔍</div><div class="ic">📁</div><div class="ic">🌐</div><div class="ic">💬</div>
    <div class="tray"><div id="t2"></div><div id="d2"></div></div>
  </div>
</section>

<script>
// Leave PASSWORD empty to accept anything; set a value (e.g. "sonali") to require it.
const PASSWORD = "sonali";
const $ = id => document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on')}
function tick(){
  const n=new Date();
  const t=n.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  $('t1').textContent=t;$('t2').textContent=t;
  $('d1').textContent=n.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});
  $('d2').textContent=n.toLocaleDateString([], {day:'numeric',month:'numeric',year:'numeric'});
}
tick();setInterval(tick,15000);

$('lock').addEventListener('click',()=>{$('wall').classList.add('blur');show('login');$('pw').focus()});
$('lock').addEventListener('keydown',()=>{});
document.addEventListener('keydown',e=>{if($('lock').classList.contains('on')){$('wall').classList.add('blur');show('login');$('pw').focus()}});

function submit(){
  const v=$('pw').value;
  if(!v || (PASSWORD && v!==PASSWORD)){
    $('err').textContent = v ? 'The password is incorrect. Try again.' : 'Enter your password.';
    $('pwbox').classList.remove('shake');void $('pwbox').offsetWidth;$('pwbox').classList.add('shake');
    return;
  }
  show('load');
  const msgs=['Hi Sonali','Setting things up','Almost ready'];
  let i=0;const iv=setInterval(()=>{i=Math.min(i+1,msgs.length-1);$('lmsg').textContent=msgs[i]},1600);
  setTimeout(()=>{clearInterval(iv);$('wall').classList.remove('blur');show('desk')},5200);
}
$('hintbtn').addEventListener('click',()=>{$('hinttext').textContent='Hint: your name in lowercase'});
$('out').addEventListener('click',()=>{$('pw').value='';$('err').textContent='';$('hinttext').textContent='';$('lmsg').textContent='Hi Sonali';$('wall').classList.remove('blur');show('lock')});
$('go').addEventListener('click',submit);
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});

</script>
</body>
</html>
